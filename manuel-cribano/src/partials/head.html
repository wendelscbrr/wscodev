<!doctype html>
<html lang="es-ES">
<head>
  <meta charset="utf-8">
  <!-- Garante a barra final (/biografia → /biografia/) para os caminhos relativos funcionarem -->
  <script>if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="author" content="Manuel Cribaño · El Niño de Peñaflor">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0e0b0a">
  <meta name="format-detection" content="telephone=no">
  <!-- Endereço atual (wscodev.com). Ao mover para o domínio do artista: build.ps1 ($SITE) e site/robots.txt -->
  <link rel="canonical" href="{{canonical}}">

  <!-- Compartilhamento -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="Manuel Cribaño · El Niño de Peñaflor">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{site}}assets/img/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Manuel Cribaño, El Niño de Peñaflor, cantando en el videoclip de «Marianas»">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{site}}assets/img/og-image.jpg">

  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{root}}assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="manifest" href="{{root}}site.webmanifest">

  <link rel="preload" href="{{root}}assets/fonts/anton-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{root}}assets/fonts/inter-400-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  {{head}}
  <!-- Tailwind compilado (fonte: src/input.css — rode build.ps1) -->
  <link rel="stylesheet" href="{{root}}assets/css/style.css?v={{v}}">
</head>
<body class="grain bg-ink font-sans text-bone overflow-x-hidden" data-page="{{key}}">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-bone focus:px-5 focus:py-3 focus:text-ink">Saltar al contenido</a>
